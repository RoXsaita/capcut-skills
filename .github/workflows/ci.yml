name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    name: Skill files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Require SKILL.md in each skill
        run: |
          set -euo pipefail
          for s in capcut-cli capcut-editing capcut-editing-talking-head capcut-editing-screen-recording; do
            test -f "$s/SKILL.md"
          done
          test -f LICENSE
          test -f NOTICE

      - name: Use Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Frontmatter, referenced files, internal links, and parity with the CLI contract
      # vendored in .capcut/. Existence checks alone missed every drift that actually
      # happened: a moved command surface and a false --dry-run guarantee.
      - name: Validate skills
        run: python3 scripts/validate.py

      # And prove the validator still fails on each defect it exists to catch.
      - name: Test the validator
        run: python3 scripts/test_validate.py
